<header>
  <div class="bar">
    <div class="brand"><span class="logo">⇄</span> Patient Moves</div>
    <nav>
      <a routerLink="/patients" routerLinkActive="active">Patient record</a>
      <a routerLink="/moves" routerLinkActive="active">Patient move</a>
      <a routerLink="/pending" routerLinkActive="active">Pending messages</a>
      <a routerLink="/delivered" routerLinkActive="active">Delivered</a>
      <a routerLink="/dead-letters" routerLinkActive="active">Dead letters</a>
    </nav>
    <button type="button" class="theme" (click)="toggleTheme()"
            [title]="theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'">
      {{ theme() === 'light' ? '☾' : '☀' }}
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>
