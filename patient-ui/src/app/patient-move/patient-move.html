<section class="card">
  <div class="card-header">
    <div>
      <h2>Record move</h2>
      <p>Saves the move and publishes PatientMoved to the patient-moved topic.</p>
    </div>
  </div>

  @if (notice(); as n) {
    <p class="notice" [class]="n.kind">{{ n.text }}</p>
  }

  @if (patients().length === 0) {
    <div class="empty">
      <strong>No patients to move</strong>
      <a routerLink="/patients">Register a patient</a> first.
    </div>
  } @else {
    <form #moveForm="ngForm" (ngSubmit)="recordMove()">
      <label>
        Patient
        <app-patient-picker [patients]="patients()" [(selectedId)]="patientId" />
      </label>
      <label>Room <input name="room" [(ngModel)]="room" placeholder="ICU-3" required /></label>
      <button type="submit" [disabled]="moveForm.invalid || patientId === null">Record move</button>
    </form>
  }
</section>
