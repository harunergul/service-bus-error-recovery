<section class="card">
  <div class="card-header">
    <div>
      <h2>notification-service outage</h2>
    </div>
    @if (outage.down()) {
      <span class="badge danger">Down</span>
    } @else {
      <span class="badge">Up</span>
    }
  </div>

  @if (outage.down()) {
    <div class="outage">
      <div class="outage-time">
        <span class="countdown mono">{{ outage.countdown() }}</span>
        <span class="muted">left of {{ outage.totalSeconds() }}s, {{ outage.failureLabel() }}</span>
      </div>
      <div class="outage-bar" role="progressbar" [attr.aria-valuenow]="outage.remainingSeconds()"
           aria-valuemin="0" [attr.aria-valuemax]="outage.totalSeconds()">
        <div class="outage-fill" [style.width.%]="outage.progress()"></div>
      </div>
      <button type="button" class="secondary" (click)="end()">End now</button>
    </div>
  } @else {
    <form #outageForm="ngForm" (ngSubmit)="start()">
      <label>
        Fails with
        <select name="failure" [(ngModel)]="failure">
          @for (f of failures; track f.value) {
            <option [ngValue]="f.value">{{ f.label }}</option>
          }
        </select>
      </label>
      <label>Duration (seconds) <input name="seconds" type="number" min="1" [(ngModel)]="seconds" required /></label>
      <button type="submit" [disabled]="outageForm.invalid || seconds < 1">Start outage</button>
    </form>
  }

  @if (notice(); as n) {
    <p class="notice below" [class]="n.kind">{{ n.text }}</p>
  }
</section>
