<section class="card">
  <div class="card-header">
    <div>
      <h2>notification-service outage</h2>
      <p>While down, notification-service answers 503 to every PatientMoved and to the listener's probe.</p>
    </div>
    @if (down()) {
      <span class="badge danger">Down</span>
    } @else {
      <span class="badge">Up</span>
    }
  </div>

  @if (down()) {
    <div class="outage">
      <div class="outage-time">
        <span class="countdown mono">{{ countdown() }}</span>
        <span class="muted">left of {{ totalSeconds() }}s</span>
      </div>
      <div class="outage-bar" role="progressbar" [attr.aria-valuenow]="remainingSeconds()"
           aria-valuemin="0" [attr.aria-valuemax]="totalSeconds()">
        <div class="outage-fill" [style.width.%]="progress()"></div>
      </div>
      <button type="button" class="secondary" (click)="end()">End now</button>
    </div>
  } @else {
    <form #outageForm="ngForm" (ngSubmit)="start()">
      <label>Duration (seconds) <input name="seconds" type="number" min="1" [(ngModel)]="seconds" required /></label>
      <button type="submit" [disabled]="outageForm.invalid || seconds < 1">Start outage</button>
    </form>
  }

  @if (notice(); as n) {
    <p class="notice below" [class]="n.kind">{{ n.text }}</p>
  }
</section>
