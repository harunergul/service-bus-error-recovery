spring.application.name=patient-service

# File-based H2 so data survives restarts (relative to the working directory: patient-service/data/)
spring.datasource.url=jdbc:h2:file:./data/patient-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Include the reason (e.g. "Patient 999 not found") in error responses so the UI can show it
spring.web.error.include-message=always

# Local Service Bus emulator (see infra/)
servicebus.connection-string=Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
servicebus.topic=patient-moved
servicebus.subscription=notification-service

# Set to false to stop consuming and let messages pile up in the subscription
listener.enabled=true
# How many Patients (sessions) the listener handles at once; each session is still processed in order
listener.max-concurrent-sessions=4

notification-service.url=http://localhost:8000
# Fail fast so retries fit well inside the message lock (Feign's default read timeout is 60s)
spring.cloud.openfeign.client.config.notification-service.connect-timeout=2000
spring.cloud.openfeign.client.config.notification-service.read-timeout=5000

# Retry the Feign call in place before giving the message back to Service Bus.
# Set the flag to false (and restart) to call once per Delivery, e.g. if retrying makes things worse.
listener.notification-retry.enabled=true
# Only connection failures and 5xx are retried; a 4xx would fail the same way again.
resilience4j.retry.instances.notification-service.max-attempts=5
resilience4j.retry.instances.notification-service.wait-duration=500ms
resilience4j.retry.instances.notification-service.enable-exponential-backoff=true
resilience4j.retry.instances.notification-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.notification-service.retry-exceptions=feign.RetryableException,feign.FeignException$FeignServerException

# Around the retries: after enough failed Deliveries, stop receiving until notification-service answers again,
# so an outage leaves messages waiting in the subscription instead of using up their Deliveries.
# Set the flag to false (and restart) to keep receiving through an outage.
listener.notification-circuit-breaker.enabled=true
# While stopped, how often to send a HEAD probe (any answer but a 5xx means it is back)
listener.notification-circuit-breaker.probe-interval=10s
# Opens when at least half of the last 5 Deliveries failed (after at least 3)
resilience4j.circuitbreaker.instances.notification-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.notification-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
# Half-open lets one Delivery per concurrent session through (listener.max-concurrent-sessions), so none is turned away
resilience4j.circuitbreaker.instances.notification-service.permitted-number-of-calls-in-half-open-state=4
# Same failures as the retry: a 4xx is the message's fault, not an outage
resilience4j.circuitbreaker.instances.notification-service.record-exceptions=feign.RetryableException,feign.FeignException$FeignServerException
